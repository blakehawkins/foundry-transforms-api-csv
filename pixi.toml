[workspace]
name = "foundry-transforms-api-csv"
version = "0.2.1"
description = "Local testing and execution environment for Palantir Foundry data pipelines"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.10,<3.11"
pyspark = "~=3.4.0"
pytest = ">=9.0.3"

[pypi-dependencies]
transformsbase = { git = "https://github.com/blakehawkins/foundry-transforms-api.git", rev = "5db36312065e66a90107caad46afce12b00cf815" }

[tasks.test]
cmd = "pytest -rA"
cwd = "transforms/api"
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT" }
